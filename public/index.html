<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baari - Smart Queue & Wait-Time Optimizer</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #EEF2F8;
      color: #14213D;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .card {
      background: #FFFFFF;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 4px 16px rgba(20, 33, 61, 0.08);
      max-width: 480px;
      width: 100%;
    }
    h1 {
      margin: 0 0 12px;
      font-size: 28px;
    }
    p {
      color: #5B6785;
      font-size: 16px;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      background: #FFD23F;
      color: #14213D;
      padding: 6px 14px;
      border-radius: 20px;
      font-weight: 600;
      font-size: 14px;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Baari (باری)</h1>
    <p>Wait anywhere. Be there when it's your baari.</p>
    <div class="badge">Stage 1 Setup Active</div>
  </div>
</body>
</html>
