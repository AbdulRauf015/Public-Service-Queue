<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Token · Baari</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="page-wrapper">
    <!-- Reconnecting chip for offline state -->
    <div id="reconnectingChip" class="alert-banner almost" style="display: none; margin-bottom: 16px;">
      Reconnecting...
    </div>

    <!-- Top Bar -->
    <header class="top-nav">
      <a href="/" class="brand-logo">
        <span data-i18n="brand_name">Baari</span>
        <span class="sub" id="serviceNavLabel">Queue</span>
      </a>

      <div style="display: flex; align-items: center; gap: 8px;">
        <!-- Accessibility Controls (Large text A+, High contrast) -->
        <div class="a11y-controls" role="group" aria-label="Accessibility controls">
          <button type="button" class="a11y-btn" id="largeTextToggle" title="Large text (20px)" aria-label="Toggle large text">A+</button>
          <button type="button" class="a11y-btn" id="highContrastToggle" title="High contrast" aria-label="Toggle high contrast">◐</button>
        </div>

        <!-- Language Switch -->
        <div class="lang-switch" role="group" aria-label="Language">
          <button type="button" class="lang-btn active" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="ur">اردو</button>
          <button type="button" class="lang-btn" data-lang="sd">سنڌي</button>
        </div>
      </div>
    </header>

    <main>
      <!-- Optional In-page Alert Banner (aria-live="assertive" for turn/leave alerts) -->
      <div id="alertBanner" class="alert-banner almost" style="display: none;" role="alert" aria-live="assertive">
        <span id="bannerText"></span>
      </div>

      <!-- Hero Ticket: The first and biggest thing on screen -->
      <div class="ticket-wrapper">
        <article id="ticketStub" class="ticket printing">
          <div class="ticket-top-label" data-i18n="your_token">Your token</div>
          <div class="ticket-code num" id="ticketCode" dir="ltr">---</div>
          
          <div class="perf" aria-hidden="true"></div>

          <!-- Large readable text inside the ticket (min 20px) with aria-live="polite" -->
          <div id="ticketAhead" class="ticket-ahead" aria-live="polite">Calculating...</div>
          <div id="ticketEstimate" class="ticket-estimate" aria-live="polite">Estimated wait calculating...</div>
          <div id="ticketConfidence" class="ticket-confidence">Confidence: Good</div>

          <!-- Called state elements inside the green ticket -->
          <div id="calledPanel" style="display: none;">
            <button type="button" id="imHereBtn" class="btn-im-here" data-i18n="im_here">
              I'm here
            </button>
            <div>
              <span id="graceTimerBadge" class="grace-countdown">Arrive within 90s</span>
            </div>
          </div>
        </article>
      </div>

      <!-- Queue Lane -->
      <section class="queue-lane-box" aria-labelledby="queueLaneTitle">
        <div class="queue-lane-header">
          <span id="queueLaneTitle" data-i18n="queue_lane">Queue lane</span>
          <span id="queueLaneAheadCount" style="font-size: 15px; color: var(--muted); font-weight: 600;" aria-live="polite">0 ahead</span>
        </div>
        <div class="queue-lane-track" id="queueLaneTrack" aria-label="People ahead moving to counter">
          <!-- Dots render here -->
        </div>
      </section>

      <!-- Smart Leave Alert -->
      <section class="travel-card">
        <div style="font-size: 16px; font-weight: 700; margin-bottom: 4px;" data-i18n="travel_label">Smart leave alert</div>
        <div style="font-size: 15px; color: var(--muted);" data-i18n="travel_note">Enter travel time so you can wait elsewhere and arrive just in time.</div>
        <div class="travel-row">
          <span data-i18n="im_away">I am</span>
          <input type="number" id="travelInput" class="travel-input" placeholder="20" min="0" max="180">
          <span data-i18n="min_away">min away</span>
          <button type="button" id="updateTravelBtn" class="btn-update" data-i18n="update">Update</button>
        </div>
        <div id="leaveGuidanceText" class="travel-note"></div>
      </section>

      <!-- Action Buttons -->
      <div class="actions-grid">
        <button type="button" id="shareBtn" class="btn-secondary" data-i18n="share_link">
          Share link
        </button>
        <button type="button" id="cancelBtn" class="btn-secondary" style="color: var(--flag); border-color: #FECACA;" data-i18n="cancel_token">
          Cancel token
        </button>
      </div>
    </main>

    <!-- Honest Footer Note -->
    <footer class="honest-footer">
      <div data-i18n="honest_note">Estimates update live. They are not promises.</div>
    </footer>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/socket.js"></script>
  <script src="/js/notify.js"></script>
  <script>
    let publicId = null;
    let currentToken = null;
    let lastQueueData = null;
    let graceCountdownInterval = null;

    function getPublicId() {
      const parts = window.location.pathname.split('/');
      if (parts[1] === 't' && parts[2]) {
        return parts[2];
      }
      const params = new URLSearchParams(window.location.search);
      return params.get('id');
    }

    async function initTokenPage() {
      publicId = getPublicId();
      if (!publicId) {
        window.location.href = '/';
        return;
      }

      await loadTokenDetails();

      // Re-render when language changes
      window.addEventListener('languageChanged', () => {
        if (currentToken) {
          renderToken(currentToken, lastQueueData);
        }
      });

      // Socket setup
      const socket = SocketManager.init({
        onConnect: () => {
          document.getElementById('reconnectingChip').style.display = 'none';
          SocketManager.joinToken(publicId);
          if (currentToken && currentToken.branchId) {
            SocketManager.joinBranch(currentToken.branchId);
          }
        },
        onDisconnect: () => {
          document.getElementById('reconnectingChip').style.display = 'block';
        },
        onPoll: () => loadTokenDetails(),
        onTokenUpdate: (data) => renderToken(data.token, data),
        onTokenCalled: (data) => {
          if (data.publicId === publicId) {
            loadTokenDetails();
            const cName = data.counterName || I18n.t('counter');
            NotifyManager.trigger('called', I18n.t('state_called', { counter: cName }));
          }
        },
        onNotifyAlert: (data) => {
          if (!data.publicId || data.publicId === publicId) {
            NotifyManager.trigger(data.level, data.message, data);
            loadTokenDetails();
          }
        },
        onQueueUpdate: () => loadTokenDetails()
      });

      NotifyManager.init(publicId, socket);
    }

    async function loadTokenDetails() {
      try {
        const data = await API.getToken(publicId);
        currentToken = data.token;
        lastQueueData = data.queue;
        renderToken(data.token, data.queue);
      } catch (err) {
        console.error('Error fetching token:', err);
      }
    }

    function renderToken(token, queue) {
      if (!token) return;
      lastQueueData = queue;

      const aheadCount = queue ? queue.ahead : 0;
      document.title = `${token.code} · ${aheadCount} ${I18n.t('ahead')} | Baari`;

      // Top bar service name with multilingual support
      let svcName = token.serviceId ? token.serviceId.name : I18n.t('brand_sub');
      if (I18n.currentLang === 'ur' && token.serviceId && token.serviceId.nameUr) {
        svcName = token.serviceId.nameUr;
      } else if (I18n.currentLang === 'sd' && token.serviceId && token.serviceId.nameSd) {
        svcName = token.serviceId.nameSd;
      }
      document.getElementById('serviceNavLabel').textContent = svcName;

      // Ticket Elements
      const ticketStub = document.getElementById('ticketStub');
      const ticketCode = document.getElementById('ticketCode');
      const ticketAhead = document.getElementById('ticketAhead');
      const ticketEstimate = document.getElementById('ticketEstimate');
      const ticketConfidence = document.getElementById('ticketConfidence');
      const calledPanel = document.getElementById('calledPanel');
      const alertBanner = document.getElementById('alertBanner');
      const bannerText = document.getElementById('bannerText');

      ticketCode.textContent = token.code;
      document.getElementById('queueLaneAheadCount').textContent = `${aheadCount} ${I18n.t('people_ahead')}`;

      // Reset state styles
      ticketStub.className = 'ticket';
      calledPanel.style.display = 'none';
      alertBanner.style.display = 'none';

      const confLevel = queue && queue.confidence ? queue.confidence : 'Good';
      const confLabel = I18n.t('confidence_' + confLevel.toLowerCase()) || confLevel;
      ticketConfidence.textContent = `${I18n.t('confidence_prefix')} ${confLabel}`;

      const counterName = token.counterId ? token.counterId.name : I18n.t('counter');

      // Status specific rendering matching UI-UX.md table
      if (token.status === 'called') {
        ticketStub.classList.add('is-turn');
        ticketAhead.textContent = I18n.t('state_called', { counter: counterName });
        ticketEstimate.textContent = I18n.t('your_turn');

        alertBanner.className = 'alert-banner turn';
        bannerText.textContent = I18n.t('state_called', { counter: counterName });
        alertBanner.style.display = 'flex';

        calledPanel.style.display = 'block';
        startGraceTimer(token.calledAt);
      } else if (token.status === 'serving') {
        ticketStub.classList.add('is-turn');
        ticketAhead.textContent = I18n.t('state_serving', { counter: counterName });
        ticketEstimate.textContent = I18n.t('brand_sub');
      } else if (token.status === 'completed') {
        ticketStub.style.background = 'var(--paper)';
        ticketStub.style.color = 'var(--ink)';
        ticketAhead.textContent = I18n.t('state_done');
        ticketEstimate.textContent = I18n.t('feedback_thanks');
      } else if (token.status === 'no_show') {
        ticketStub.style.background = '#CBD5E1';
        ticketStub.style.color = '#334155';
        ticketAhead.textContent = I18n.t('state_noshow');
        ticketEstimate.textContent = '';
      } else if (token.status === 'cancelled') {
        ticketStub.style.background = '#CBD5E1';
        ticketStub.style.color = '#334155';
        ticketAhead.textContent = I18n.t('state_cancelled');
        ticketEstimate.textContent = '';
      } else {
        // Status: waiting
        if (queue && queue.openCounters === 0) {
          ticketAhead.textContent = I18n.t('no_counter_open');
          ticketEstimate.textContent = I18n.t('state_no_counter', { service: svcName });
        } else {
          ticketAhead.textContent = I18n.t('state_waiting', { count: aheadCount });
          if (queue && queue.range) {
            const lowMin = Math.round(queue.range.low / 60);
            const highMin = Math.round(queue.range.high / 60);
            ticketEstimate.textContent = `${I18n.t('est_wait')} ${lowMin} to ${highMin} ${I18n.t('minutes')}`;
          } else {
            ticketEstimate.textContent = `${I18n.t('est_wait')} ...`;
          }

          // In-page alerts from TRD 4.6
          if (token.travelMinutes && queue && queue.estimateSec) {
            const estMin = Math.round(queue.estimateSec / 60);
            if (estMin <= token.travelMinutes + 5) {
              alertBanner.className = 'alert-banner leave';
              bannerText.textContent = I18n.t('state_leave_now', { counter: counterName });
              alertBanner.style.display = 'flex';
            }
          }

          if (aheadCount <= 3 && aheadCount > 0 && alertBanner.style.display === 'none') {
            alertBanner.className = 'alert-banner almost';
            bannerText.textContent = I18n.t('state_almost', { count: aheadCount });
            alertBanner.style.display = 'flex';
          }
        }
      }

      // Render Queue Lane
      renderQueueLane(aheadCount, token.code);

      // Travel time update
      if (token.travelMinutes !== null && token.travelMinutes !== undefined) {
        document.getElementById('travelInput').value = token.travelMinutes;
        renderTravelGuidance(token.travelMinutes, queue ? queue.estimateSec : null, counterName);
      }
    }

    function renderQueueLane(ahead, myCode) {
      const track = document.getElementById('queueLaneTrack');
      track.innerHTML = '';

      const maxDots = Math.min(10, ahead);
      for (let i = 0; i < maxDots; i++) {
        const dot = document.createElement('span');
        dot.className = 'lane-dot';
        track.appendChild(dot);
      }

      // Your dot in signal blue
      const you = document.createElement('span');
      you.className = 'lane-dot is-you';
      you.textContent = I18n.t('you');
      track.appendChild(you);

      // Trailing path dots toward counter
      for (let j = 0; j < 2; j++) {
        const dot = document.createElement('span');
        dot.className = 'lane-dot';
        dot.style.opacity = '0.35';
        track.appendChild(dot);
      }

      // Counter desk icon
      const desk = document.createElement('span');
      desk.className = 'lane-desk';
      desk.textContent = I18n.t('counter');
      track.appendChild(desk);
    }

    function renderTravelGuidance(travelMin, estSec, counterName = 'Counter') {
      const guidance = document.getElementById('leaveGuidanceText');
      if (!estSec) {
        guidance.textContent = '';
        return;
      }
      const estMin = Math.round(estSec / 60);
      const diff = estMin - travelMin;

      if (diff <= 5 && diff >= 0) {
        guidance.textContent = I18n.t('state_leave_now', { counter: counterName });
        guidance.style.color = 'var(--go)';
      } else if (diff > 5) {
        guidance.textContent = I18n.t('leave_in_hint', { time: diff - 5 });
        guidance.style.color = 'var(--signal)';
      } else {
        guidance.textContent = I18n.t('state_leave_now', { counter: counterName });
        guidance.style.color = 'var(--flag)';
      }
    }

    function startGraceTimer(calledAt) {
      if (graceCountdownInterval) clearInterval(graceCountdownInterval);
      const badge = document.getElementById('graceTimerBadge');
      const totalSec = 90;
      const start = calledAt ? new Date(calledAt).getTime() : Date.now();

      function tick() {
        const elapsed = Math.floor((Date.now() - start) / 1000);
        const left = Math.max(0, totalSec - elapsed);
        badge.textContent = I18n.t('arrive_within', { time: left });
        if (left === 0) {
          clearInterval(graceCountdownInterval);
          badge.textContent = I18n.t('state_noshow');
        }
      }
      tick();
      graceCountdownInterval = setInterval(tick, 1000);
    }

    // "I'm here" button
    document.getElementById('imHereBtn').addEventListener('click', async () => {
      try {
        await API.confirmArrival(publicId);
        document.getElementById('imHereBtn').disabled = true;
        document.getElementById('imHereBtn').textContent = 'Arrival confirmed';
      } catch (err) {
        alert(err.message);
      }
    });

    // Update travel time
    document.getElementById('updateTravelBtn').addEventListener('click', async () => {
      const val = document.getElementById('travelInput').value;
      try {
        await API.updateToken(publicId, { travelMinutes: val ? Number(val) : null });
        loadTokenDetails();
      } catch (err) {
        alert('Could not update travel time');
      }
    });

    // Share link
    document.getElementById('shareBtn').addEventListener('click', () => {
      if (navigator.share) {
        navigator.share({
          title: `My Baari Token (${currentToken ? currentToken.code : ''})`,
          url: window.location.href
        }).catch(() => {});
      } else {
        navigator.clipboard.writeText(window.location.href);
        alert('Link copied to clipboard!');
      }
    });

    // Cancel token
    document.getElementById('cancelBtn').addEventListener('click', async () => {
      if (!confirm('Are you sure you want to cancel your token?')) return;
      try {
        await API.cancelToken(publicId);
        loadTokenDetails();
      } catch (err) {
        alert(err.message || 'Could not cancel token');
      }
    });

    initTokenPage();
  </script>
</body>
</html>
